<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | BTB Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/contact.css">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

   
</head>
<body class="contact-page">
    <div class="glow-cursor" id="contactGlowCursor"></div>
    <canvas id="contactParticles"></canvas>

    <div class="relative z-10 w-full min-h-screen flex flex-col" id="contactMainWrap">
        <div class="flex items-center justify-end p-4 gap-3 fade-up">
                <!-- <i data-lucide="moon" style="width:16px;height:16px;" class="opacity-50"></i> -->
            <!-- <div class="toggle-btn" id="contactThemeToggle" role="switch" aria-label="Toggle light and dark mode" tabindex="0">
                <div class="dot"></div>
            </div> -->
                <!-- <i data-lucide="sun" style="width:16px;height:16px;" class="opacity-50"></i> -->

        </div>

        <header class="text-center px-6 pt-8 pb-12 fade-up fade-up-d1">
            <h1 class="text-4xl md:text-6xl font-bold mb-4">
                <span class="typewriter-wrap bg-gradient-to-r from-[#00f0ff] to-[#7b61ff] bg-clip-text text-transparent">CONTACT US</span>
            </h1>
            <p class="text-base md:text-lg opacity-50 max-w-lg mx-auto">Let's build something extraordinary together</p>
        </header>

        <section class="px-6 max-w-5xl mx-auto w-full grid grid-cols-1 md:grid-cols-3 gap-4 mb-12 fade-up fade-up-d2">
            <div class="info-card glass rounded-2xl p-6 text-center">
                <div class="w-12 h-12 mx-auto mb-3 rounded-full flex items-center justify-center" style="background:rgba(0,240,255,0.1);">
                    <i data-lucide="mail" style="width:22px;height:22px;color:#00f0ff;"></i>
                </div>
                <p class="text-sm opacity-40 mb-1">Email</p>
                <p class="font-medium text-sm">hello@yourdomain.com</p>
            </div>

            <div class="info-card glass rounded-2xl p-6 text-center">
                <div class="w-12 h-12 mx-auto mb-3 rounded-full flex items-center justify-center" style="background:rgba(123,97,255,0.1);">
                    <i data-lucide="phone" style="width:22px;height:22px;color:#7b61ff;"></i>
                </div>
                <p class="text-sm opacity-40 mb-1">Phone</p>
                <p class="font-medium text-sm">+93 76 7423806</p>
            </div>

            <div class="info-card glass rounded-2xl p-6 text-center">
                <div class="w-12 h-12 mx-auto mb-3 rounded-full flex items-center justify-center" style="background:rgba(255,77,106,0.1);">
                    <i data-lucide="map-pin" style="width:22px;height:22px;color:#ff4d6a;"></i>
                </div>
                <p class="text-sm opacity-40 mb-1">Location</p>
                <p class="font-medium text-sm">AF, Kabul</p>
            </div>
        </section>

        <section class="px-6 max-w-2xl mx-auto w-full mb-16 fade-up fade-up-d3">
            <div class="glass-strong rounded-3xl p-8 relative" id="contactFormCard">
                <form id="contactForm" novalidate autocomplete="on">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                        <div class="float-field">
                            <input type="text" id="contactName" name="name" placeholder=" " autocomplete="name" required>
                            <label for="contactName">Name</label>
                            <div class="err-msg" id="contactNameErr"></div>
                        </div>
                        <div class="float-field">
                            <input type="email" id="contactEmail" name="email" placeholder=" " autocomplete="email" required>
                            <label for="contactEmail">Email</label>
                            <div class="err-msg" id="contactEmailErr"></div>
                        </div>
                    </div>

                    <div class="float-field mb-5">
                        <input type="text" id="contactSubject" name="subject" placeholder=" " required>
                        <label for="contactSubject">Subject</label>
                        <div class="err-msg" id="contactSubjectErr"></div>
                    </div>

                    <div class="float-field mb-6">
                        <textarea id="contactMessage" name="message" rows="5" placeholder=" " required style="resize:vertical;min-height:100px;"></textarea>
                        <label for="contactMessage">Message</label>
                        <div class="err-msg" id="contactMessageErr"></div>
                    </div>

                    <button type="submit" class="send-btn w-full" id="contactSendBtn">
                        <span class="btn-text flex items-center justify-center gap-2">
                            <i data-lucide="send" style="width:18px;height:18px;"></i>
                            Send Message
                        </span>
                        <div class="spinner"></div>
                    </button>
                </form>

                <div class="success-overlay" id="contactSuccessOverlay">
                    <div class="check-circle w-16 h-16 rounded-full flex items-center justify-center mb-4" style="background:linear-gradient(135deg,#00f0ff,#7b61ff);">
                        <i data-lucide="check" style="width:32px;height:32px;color:#0a0a1a;stroke-width:3;"></i>
                    </div>
                    <p class="text-xl font-semibold mb-1">Message Sent!</p>
                    <p class="text-sm opacity-50">Thanks, I'll get back to you soon.</p>
                    <button class="mt-6 text-sm px-5 py-2 rounded-lg" id="contactResetBtn">Send Another</button>
                </div>
            </div>
        </section>

        <section class="px-6 max-w-3xl mx-auto w-full text-center mb-12 fade-up fade-up-d4">
            <h2 class="text-2xl md:text-3xl font-bold mb-3 bg-gradient-to-r from-[#00f0ff] to-[#7b61ff] bg-clip-text text-transparent">Let's Work Together</h2>
            <p class="opacity-50 max-w-md mx-auto mb-6">Have a project in mind? I'd love to hear about it.</p>
            <div class="flex justify-center gap-3">
                <a href="#" class="social-icon" aria-label="GitHub"><i data-lucide="github" style="width:20px;height:20px;"></i></a>
                <a href="#" class="social-icon" aria-label="Twitter"><i data-lucide="twitter" style="width:20px;height:20px;"></i></a>
                <a href="#" class="social-icon" aria-label="LinkedIn"><i data-lucide="linkedin" style="width:20px;height:20px;"></i></a>
                <a href="#" class="social-icon" aria-label="Instagram"><i data-lucide="instagram" style="width:20px;height:20px;"></i></a>
            </div>
        </section>

        <footer class="text-center py-6 text-xs opacity-30">
            &copy; 2025 Crafted with care
        </footer>
    </div>

    <script src="src/js/contact.js"></script>
</body>
</html>
